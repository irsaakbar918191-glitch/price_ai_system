services:
  - type: web
    name: price-ai-system
    env: python
    buildCommand: |
      apt-get update && apt-get install -y tesseract-ocr libgl1
      pip install -r requirements.txt
      pip install gunicorn
    startCommand: gunicorn app:app
    envVars:
      - key: TESSERACT_CMD
        value: /usr/bin/tesseract