<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Price AI System{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar">
            <div class="brand">
                <i class="fa-solid fa-chart-line brand-icon"></i>
                <span class="brand-text">Price<span class="gradient-text">AI</span></span>
            </div>
            <nav class="nav-menu">
                <a href="/" class="nav-item active" id="nav-dashboard">
                    <i class="fa-solid fa-house"></i>
                    <span>Dashboard</span>
                </a>
                <a href="#chat-section" class="nav-item" id="nav-chat">
                    <i class="fa-solid fa-robot"></i>
                    <span>AI Assistant</span>
                </a>
                <a href="#products-section" class="nav-item" id="nav-inventory">
                    <i class="fa-solid fa-boxes-stacked"></i>
                    <span>Inventory</span>
                </a>
                <a href="#upload-modal" class="nav-item" id="nav-upload-trigger">
                    <i class="fa-solid fa-cloud-arrow-up"></i>
                    <span>Batch Import</span>
                </a>
            </nav>
            <div class="user-profile" id="user-profile-widget">
                <div class="avatar"><i class="fa-solid fa-user"></i></div>
                <div class="user-meta">
                    <span class="user-name" id="user-display-email">Guest User</span>
                    <button class="logout-link" id="auth-action-btn">Login</button>
                </div>
            </div>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <div class="search-bar">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="global-search" placeholder="Quick search inventory or ask AI...">
                </div>
                <div class="top-actions">
                    <button class="btn btn-primary" id="open-upload-btn">
                        <i class="fa-solid fa-plus"></i> Import Catalog
                    </button>
                </div>
            </header>

            <div class="content-body">
                {% block content %}{% endblock %}
            </div>
        </main>
    </div>

    <script src="/static/js/auth.js"></script>
    <script src="/static/js/upload.js"></script>
    <script src="/static/js/chat.js"></script>
</body>
</html>
