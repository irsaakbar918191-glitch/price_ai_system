{% extends "base.html" %}

{% block title %}Account Access | Price AI{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <i class="fa-solid fa-shield-halved auth-icon"></i>
            <h2 id="auth-title">Welcome Back</h2>
            <p id="auth-desc">Login to manage prices and inventory intelligence</p>
        </div>
        <form id="auth-form">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="auth-email" required placeholder="you@company.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="auth-password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn btn-primary btn-block" id="auth-submit-btn">Login</button>
            <div id="auth-alert" class="status-msg"></div>
        </form>
        <div class="auth-switch">
            <span id="auth-toggle-text">Don't have an account?</span>
            <button type="button" class="link-btn" id="toggle-auth-mode">Sign Up</button>
        </div>
    </div>
</div>
{% endblock %}
